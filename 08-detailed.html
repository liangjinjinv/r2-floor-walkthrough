<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>08 前置仓 · 高细节 3D 漫游</title>
<link rel="stylesheet" href="warehouse.css">
</head>
<body>
<header class="mast">
 <div><a class="back" href="./?station=8">返回一层导览</a><span>R2 一层 · 08</span></div>
</header>
<main>
 <div class="intro">
  <div><p class="tag">前置仓 / 实时 3D 样段</p><h1>走进前置仓</h1></div>
  <p>可走动、转头，从不同角度看顶灯、货架和地面阴影。以 R2 的动线和图示布置为基准；材料和灯光是装修提案。</p>
 </div>
 <section class="viewer" aria-label="前置仓第一人称漫游">
  <div class="stage">
   <canvas id="view" tabindex="0" aria-label="前置仓 3D 场景：拖动转头，WASD 或方向键行走" aria-describedby="controlsHint"></canvas>
   <p id="loading" class="loading">正在载入前置仓 3D 场景…</p>
   <div class="station-stamp">08 <span>前置仓</span></div>
   <div class="move-pad" role="group" aria-label="步行控制">
    <button type="button" data-move="KeyW" aria-label="向前走">前</button>
    <button type="button" data-move="KeyA" aria-label="向左走">左</button>
    <button type="button" data-move="KeyS" aria-label="向后走">后</button>
    <button type="button" data-move="KeyD" aria-label="向右走">右</button>
   </div>
  </div>
  <div class="bar">
   <div class="presets" id="presets" aria-label="切换站位"></div>
   <p id="controlsHint">拖动转头 · WASD 或方向键行走 · 也可按住画面里的方向按钮</p>
  </div>
 </section>
 <div class="meta">
  <p id="status" role="status" aria-live="polite">准备载入渲染器</p>
  <a href="finish-08.jpg" target="_blank" rel="noopener">查看原静态效果图</a>
 </div>
 <noscript><p>打开浏览器的 JavaScript 后才能使用实时 3D 漫游。也可先返回一层导览或对照图纸。</p></noscript>
</main>
<script type="module" src="warehouse-page.mjs"></script>
</body>
</html>
